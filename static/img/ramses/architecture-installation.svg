    <text x="818" y="372">monte</text>
    <text x="930" y="128" text-anchor="middle">r&#233;seau priv&#233;</text>
  </g>
  <text class="label" x="640" y="668" text-anchor="middle" font-size="15">VM RAG : Docker, images, conteneurs et volumes. Les mod&#232;les restent sur le moteur d'inf&#233;rence.</text>
</svg>