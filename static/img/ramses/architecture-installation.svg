<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Architecture d'installation RAMSES RAG</title>
  <desc id="desc">Le navigateur joint l'entree en HTTPS. install.sh commande Docker sur la VM RAG. Docker charge les images et cree les conteneurs. Les volumes gardent les donnees et le trousseau. L'api appelle le moteur d'inference, ou restent les modeles.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f7ff"/>
      <stop offset="1" stop-color="#b6dff6"/>
    </linearGradient>
    <linearGradient id="leftF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecff0"/>
      <stop offset="1" stop-color="#4aa4d6"/>
    </linearGradient>
    <linearGradient id="rightF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d90c6"/>
      <stop offset="1" stop-color="#286fa0"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c739f"/>
      <stop offset="0.42" stop-color="#6ab4dc"/>
      <stop offset="1" stop-color="#275f8c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
