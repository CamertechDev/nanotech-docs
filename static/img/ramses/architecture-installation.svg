      <path d="M0 1.3 9 5 0 8.7z" fill="#3e5566"/>
    </marker>
    <symbol id="cube" viewBox="0 0 92 74">
      <polygon points="46,2 88,20 46,38 4,20" fill="url(#top)"/>
      <polygon points="4,20 46,38 46,68 4,50" fill="url(#leftF)"/>
      <polygon points="46,38 88,20 88,50 46,68" fill="url(#rightF)"/>
    </symbol>
    <symbol id="cylinder" viewBox="0 0 92 78">
      <path d="M8 18 v36 c0 8 17 14 38 14 s38-6 38-14 V18" fill="url(#cyl)"/>
